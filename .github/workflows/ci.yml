name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:
  schedule:
    # -- dependencies are unpinned, so new releases can break the package without a commit here
    - cron: "0 5 * * 1"

permissions:
  contents: read

# -- a new push to a pull request replaces the run of the previous push
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build environment (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Build package
        run: |
          python -m pip install build
          python -m build

      - name: Install package in a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/clean"
          "$RUNNER_TEMP/clean/bin/python" -m pip install dist/*.whl

      - name: Check for conflicting dependencies
        run: '"$RUNNER_TEMP/clean/bin/python" -m pip check'

      - name: Run installed package
        working-directory: ${{ runner.temp }}
        run: '"$RUNNER_TEMP/clean/bin/python" "$GITHUB_WORKSPACE/.github/smoke_test.py"'

  test:
    name: Tests (${{ matrix.python-version }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package with test dependencies
        run: python -m pip install -e ".[test]"

      - name: Run tests with coverage
        run: pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.xml

  # -- the single check to require on pull requests, so that the Python versions above can change without updating
  # the repository settings. Runs always, as a skipped required check counts as passed
  ci-passed:
    name: CI passed
    if: always()
    needs: [build, test]
    runs-on: ubuntu-latest
    steps:
      - name: Check results of all jobs
        run: test "${{ needs.build.result }}" = success && test "${{ needs.test.result }}" = success
