[project]
name = "py-automl-lib"
version = "2.2.14"
authors = [
  { name="Owen O'D"},
]
description = "Python package for automated hyperparameter-optimization of common machine-learning algorithms"
readme = "README.md"
requires-python = ">=3.11.0,<3.13.0"
classifiers = [
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]


dependencies = [
  "catboost",
  "xgboost",
  "lightgbm",
  "optuna",
  "scikit-learn",
  "numpy",
  
  # this pandas version is needed to prevent errors in grouping by index
  "pandas>=3.0.0",
  "SQLAlchemy",
  "timeout-decorator",
  "fastparquet",
  "pyarrow",

  # these are needed for watermarking package versions
  "tomli",
  "watermark",

  # for pickling custom scorers
  "cloudpickle",

]

[project.optional-dependencies]
  shap = ["shap"]
  test = ["pytest", "pytest-cov", "pytest-timeout", "shap"]

[project.urls]
Homepage = "https://github.com/owenodriscoll/AutoML"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
# -- known bugs are strict xfails: once fixed the test fails until its marker is removed
xfail_strict = true
markers = ["slow: exhaustive tests over all models and settings, excluded with -m 'not slow'"]
# -- thread method, as the signal method would conflict with the SIGALRM of `timeout_trial`
timeout = 300
timeout_method = "thread"

[tool.coverage.run]
source = ["automl"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
